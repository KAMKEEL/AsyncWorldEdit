awe:
  #Do not change
  version: 21
  #block placement engine (experimental buffer-first branch)
  engine:
    #placement engine:
    # buffered = buffer-first: async edits are buffered straight into per job
    #   chunk section buffers (no per block queue entry object) and streamed
    #   out as direct chunk writes while the job runs (see stream below);
    #   lowest memory + fastest.
    #   Requires BlocksHub access checking to be disabled (it bypasses the per
    #   block access hooks); when access checking is on AWE logs one line and
    #   falls back to classic automatically.
    # classic = per block placement (the previous/direct-chunk pipeline)
    mode: buffered
    #undo capture for buffered plain blocks:
    # columnar = old values are captured at flush time into a packed per job
    #   delta stream (RLE compressed, spooled to disk above the threshold
    #   below); tiles/NBT and classic-path blocks keep the full object change
    #   set. Lowest memory, the same //undo///redo commands.
    # changeset = record every block through WorldEdit's operation time
    #   change set (the previous behavior, full NBT fidelity)
    undo-mode: columnar
    #per job columnar undo log memory budget (MB) before it spools to a temp
    #file in the undo folder
    undo-spool-threshold-mb: 8
    #verbose engine logging: the per placer run [ENGINE] line (blocks, wall
    #time, TPS, budget, queue + buffer counters) and the per job completion
    #line (blocks/sec, heap-peak/delta, minTPS, budget-exceeded, gc). This
    #key only seeds the live toggle at startup/reload - flip it in game with
    #/awe engine debug on|off. Backward compat: messages.debug=true also
    #turns these lines on (the old [BP RUN] line folded into [ENGINE]).
    debug: false
    #region streamed flushing (buffered engine): chunks of a running job are
    #flushed DURING production instead of all at once at job end - blocks pop
    #progressively, live buffer memory stays bounded by the window, and the
    #end-of-job flush burst disappears
    stream:
      #flush ready chunks while the job is still producing
      enabled: true
      #per job live section window: when a job holds more section buffers
      #than this, its least-recently-written chunks are flushed until the
      #job is down to HALF the window (hysteresis: fewer, larger flush
      #passes instead of re-flushing thin slices of the same chunks).
      #256 sections = 8 MB of live buffers per job
      window-sections: 256
      #a chunk not written to for this many placer runs is flushed
      #(40 runs = ~2 seconds at rendering interval 1)
      stale-runs: 40
  rendering:
    #amount of time (in ticks) the server will place a chunk of blocks
    interval: 1
    #how often that a user will get an update on the current que (number of intervals)
    talk-interval: 10
    #number of seconds before repeating a message
    talk-cooldown: 5
    #maximum size of the blocks queue
    queue-max-size-hard: 10000000
    #maximum number of blocks on the global queue before unlocing it
    queue-max-size-soft: 5000000
    #TPS the adaptive block placer budget tries to keep the server at
    adaptive-target-tps: 18
    #time (in ms) the block placer may spend per run when the server is at the target TPS
    adaptive-base-budget-ms: 20
    #extra time (in ms) the block placer may use when the server is otherwise idle (20 TPS)
    adaptive-idle-extra-ms: 30
    #minimum time (in ms) the block placer always gets, even when the server is lagging
    adaptive-min-budget-ms: 2
    #direct chunk block placement: queued plain blocks (no NBT) are grouped per chunk
    #and written straight into the chunk sections, followed by one chunk refresh packet,
    #instead of being placed one by one through the Bukkit API
    #
    #Behaviour differences vs classic placement (know these before enabling):
    # * batched blocks do NOT fire physics or neighbor notifications (fastmode-like);
    #   mod machines that rely on onBlockAdded/neighbor updates may need classic mode
    #   (enabled: false)
    # * the precipitation heightmap is not rebuilt (rain/snow may render at the old
    #   surface height until the chunk reloads)
    # * relighting is capped per chunk - after giant pastes run //fixlighting on the
    #   area if you see dark spots
    #
    #This feature self-activates on upgrade (enabled: true is the default); AWE logs
    #one line at startup stating whether direct chunk placement is active. When the
    #server chunk layout is not recognized (or fails the sanity checks) AWE
    #automatically falls back to the classic per block placement.
    direct-chunk:
      #enable the direct chunk placement; when the server chunk layout is not
      #recognized AWE automatically falls back to the classic per block placement
      enabled: true
      #minimum number of blocks queued for a single chunk in one placer run before
      #the direct chunk path is used; smaller batches use the classic path
      minimum-blocks-per-chunk: 64
  memory:
    #minumum free memory (in kilobytes)
    #When the server memory runs below this value all operations are going to cancel
    #Use -1 for no limit
    minimumHard: 400000
    #the minimum free memory (In kulobytes) required to allow
    #block queuing after the hard limit is reached (soft > hard)
    minimumSoft: 600000
    #Force GC to run each X miliseconds (-1 - disable) when memory is low
    #Warning: if this is not handled correctly it can lead to TPS drop and timeouts!
    gcTimeout: 10000
  dispatcher:
    #maximum number of jobs performed in one run
    max-jobs: 2000
    #maximum number of idle runs before disabling the dispatcher
    max-idle-runs: 200
    #maximum number of miliseconds the dispatcher can use
    #This value should be lower than 50% of 1 tick (25ms)
    max-time: 20
  #Maximum number of blocks in que mode before AWE forces block placing.
  #Use -1 to disable force flush.
  forceFlushBlocks: 10000
  #Check for updates
  checkVersion: true
  #Disable or enable blocks physics freeze when placing blocks
  physicsFreez: true
  #File containing all the messages
  strings: "english.yml"
  messages:
    #Show debug messages: the NON engine chatter (injector operation tracing,
    #session/undo file logging). Backward compat: true also enables the
    #[ENGINE] debug lines, which have their own switch at awe.engine.debug
    debug: false
    #Show undo cleanup messages
    #Valid options (KEEP THE QUOTES - bare on/off are YAML booleans, which
    #the parser reads as "true"/"false" and falls back to the default):
    # * "off" - no message (only errors),
    # * "startup" - show the message only on startup
    # * [Default] "on" - show all undo cleanup messages
    undoCleanup: "on"
  #Disable async mode for
  overrides:
    #WorldEdit api calls
    disableForWeApi: false
    #for console player
    disableForConsole: false
    #for unknown player
    disableForUnknown: false
  #Blocks hub plugin options  
  blocksHub:
    log:
        #Enable block chang loggin
        isEnabled: true
    #The block access control
    access:
        #Enable blocks access control
        isEnabled: false
        #Allow NULL player to place blocks (used by some plugins)
        allowNull: false
        #Allow unknown player to place blocks
        allowUnknown: true
        #Allow console player to place blocks
        allowConsole: true
        #Allow offline player to place blocks
        allowOffline: false
  undo:
    #What to do with the undo data when server is running low on memory and 
    #the operation is running on the main thread
    #Allowed values: 
    # * off - memory is not checked while storing undo data (can lead to server crash)
    # * drop - do not store the undo data
    # * cancel - cancel current operation (throws max block changed)    
    memoryLowMain: cancel
    #What to do with the undo data when server is running low on memory and 
    #the operation is not running on the main thread
    #Allowed values: 
    # * off - memory is not checked while storing undo data (can lead to server crash)
    # * drop - do not store the undo data
    # * cancel - cancel current operation (throws max block changed)    
    # * wait - wait for GC to free up some memory
    memoryLow: wait
    #What to do with the undo data when server is running low on memory and 
    #the operation is not running on the main thread
    #Allowed values: 
    # * off - memory is not checked while storing undo data (can lead to server crash)
    # * drop - do not store the undo data
    # * wait - wait for GC to free up some memory
    memoryLowStorage: wait
    #Store the undo data on disk (a bit slower but does not use so much RAM)
    storeOnDisk: true
    #How much time should the WorldEdit session be kept after player logged out
    #Values: -1 Do not remove, 0 - immediately, X - Number of minutes
    keepSessionOnLogoutFor: 0
    #How long should the undo files be keept on the disk after the undo is no 
    #logner used in WE.
    #Values: -1 Do not delete, 0 - Delete immediately, X - Number of minutes to store 
    #the file
    keepUndoFileFor: 0
    #The number of minutes between undo files cleanup
    undoFileCleanupInterval: 30
  #Permissions options
  permissions:
    #If you are OP you will have all AWE permissions
    #Warning this causes the negative permissions to not work.
    opHasAll: true
    #Disable the global queue bypass, the player queue bypass works like before
    #If you do not want to run out of memory you hsould not set
    #the disableQueueBypass to false and opHasAll to true
    disableQueueBypass: true
  #Player permission groups.
  #Permission node: AWE.Groups.<group name>  
  permissionGroups:
    #The group entry (at least one group is required!)
    #If a player has multiple groups, the last one defined in the config
    #is assigned. (Lower the group the lower the 'weight' if you can compare it to PEX)
    default:
      #Indicates that the group is called default.
      #Only one group can be default, if multiple groups are set to default
      #the first one is used as default. The default group is used for players
      #that do not have any other permission groups assigned to them.
      isDefault: true
      #Maximum number of jobs a player can have. -1 = no job limit
      maxJobs: 1
      #Enable or disable auto job cancelation on player quit
      cleanOnLogout: true
      #Default AWE status for loging in players 
      defaultMode: on
      #Disable the WorldEdit undo
      disableUndo: false
      renderer:
        #blocks to place (per-interval), this determines the max speed of block placing
        #if you experience lag lower this and the next number (time), use -1 for no limit
        blocks: 10000
        #Maximum number of miliseconds spend on placing blocks, use -1 for no limit
        time: 75
      queue:
        #maximum size of the player block queue
        limit-hard: 500000
        #number of blocks on the player queue when to stop placing blocks
        limit-soft: 250000
      messages:
        #Whether or not to show progress using BarAPI
        progress-bar: true
        #minimum number of blocks to display the progress bar
        progress-bar-min: 100
        #Whether or not to show progress using the chat messages
        progress-chat: true
        #is async world edit talkative 
        talkative: true
      #The WorldEdit config override
      worldedit:
        #Maximum number of undoos
        historySize: 15
        #Maximum number of changed blocks
        maxBlockChanged: -1
        #List of dissallowed block ID
        disallowedBlocks: [6, 7, 14, 15, 16, 26, 27, 28, 29, 39, 31, 32, 33, 34, 36, 37, 38, 39, 40, 46, 50, 51, 56, 59, 69, 73, 74, 75, 76, 77, 81, 83]
        #The dissallowed black list handling
        disallowedBlocksUsage:
          #Use black list in patterns
          patterns: true
          #Block set (every block set operation)
          blockSet: false
    #Example of additional vip group:
    #vip:
    #  #you can remove this, the isDefault is by default set to false
    #  isDefault: false 
    #  maxJobs: -1
    #    cleanOnLogout: false
    #  #You can omit entries with that are same value as in the default group
    #  #defaultMode: on
    #  #Disable the WorldEdit undo
    #  disableUndo: true
    #  renderer:
    #    blocks: 20000
    #    time: -1
  #List of WorldEdit operations that AWE won't run in async mode
  disabledOperations: {}
